# GitHub Actions workflow for building Kalendae on Mac OS 9
#
# Builds the Classic Mac OS 9 / PowerPC calendar application using the
# official prebuilt Retro68 cross-compilation toolchain image
# (https://github.com/autc04/Retro68), so no toolchain compilation is
# needed in CI.

name: Build Kalendae for Mac OS 9

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/autc04/retro68:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure build
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/powerpc-apple-macos/cmake/retroppc.toolchain.cmake

    - name: Diagnose available headers
      run: |
        find /Retro68-build -iname '*quickdraw*' -o -iname '*gworld*' -o -iname '*offscreen*'

    - name: Build application
      run: |
        cd build
        make

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kalendae-MacOS9-PPC
        path: |
          build/Kalendae.bin
          build/Kalendae.APPL
          build/Kalendae.dsk
